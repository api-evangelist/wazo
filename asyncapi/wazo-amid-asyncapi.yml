asyncapi: 2.0.0
info:
  title: wazo-amid events
  version: '26.08'
servers:
  production:
    url: amqp://{username}:{password}@/localhost:{port}//
    description: Local RabbitMQ messaging server for inter-service communication
    protocol: amqp
    protocolVersion: 0.9.1
    variables:
      username:
        default: guest
        description: Configurable through each service's config.yml file
      password:
        default: guest
        description: Configurable through each service's config.yml file
      port:
        default: '5672'
        description: Configurable through each service's config.yml file
defaultContentType: application/json
channels:
  '{ami_event}':
    subscribe:
      summary: ''
      tags:
      - name: amid
      message:
        name: '{ami-event}-payload'
        payload:
          type: object
          properties:
            ami_event:
              type: string
            variables:
              type: object
              properties: {}
        headers:
          type: object
          properties:
            name:
              type: string
              const: '{ami_event}'
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.ami.{name}
              description: Necessary user access required to read this event
            origin_uuid:
              $ref: '#/components/schemas/origin_uuid'
            timestamp:
              $ref: '#/components/schemas/timestamp'
          required:
          - name
          - required_acl
          - origin_uuid
          - timestamp
    parameters:
      ami_event:
        description: ''
        schema:
          type: string
components:
  schemas:
    origin_uuid:
      type: string
      format: uuid
      description: Unique identifier of the publishing WAZO service
    timestamp:
      type: string
      format: date-time
      description: Date and time this event was published
    tenant_uuid:
      type: string
      format: uuid
      description: Unique identifier of this resource's tenant
    user_uuid:{uuid}:
      type: boolean
      description: User's unique identifier that this event is intended for. The format user_uuid:{uuid} allows multiple users to be the recipient
        of this event
