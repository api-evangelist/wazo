      message:
        name: auth-session-deleted-payload
        payload:
          type: object
          properties:
            session_uuid:
              type: string
              format: uuid
        headers:
          type: object
          properties:
            name:
              type: string
              const: auth_session_deleted
              description: Name of the event (used for routing the message)
            required_acl:
