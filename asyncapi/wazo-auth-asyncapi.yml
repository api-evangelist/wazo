  auth_tenant_added:
    subscribe:
      summary: ''
      tags:
      - name: auth
      message:
        name: auth-tenant-added-payload
        payload:
          type: object
          properties:
            uuid:
              type: string
              format: uuid
            name:
              type: string
            slug:
              type: string
            domain_names:
              type: array
              items:
                type: string
        headers:
          type: object
          properties:
            name:
              type: string
              const: auth_tenant_added
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.auth.tenants.{tenant_uuid}.created
              description: Necessary user access required to read this event
            origin_uuid:
              $ref: '#/components/schemas/origin_uuid'
            timestamp:
              $ref: '#/components/schemas/timestamp'
            tenant_uuid:
              $ref: '#/components/schemas/tenant_uuid'
          required:
          - name
          - required_acl
          - origin_uuid
          - timestamp
          - tenant_uuid
  auth_tenant_deleted:
    subscribe:
      summary: ''
      tags:
      - name: auth
      message:
        name: auth-tenant-deleted-payload
        payload:
          type: object
          properties: {}
        headers:
          type: object
          properties:
            name:
              type: string
              const: auth_tenant_deleted
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.auth.tenants.{tenant_uuid}.deleted
              description: Necessary user access required to read this event
            origin_uuid:
              $ref: '#/components/schemas/origin_uuid'
            timestamp:
              $ref: '#/components/schemas/timestamp'
            tenant_uuid:
              $ref: '#/components/schemas/tenant_uuid'
          required:
          - name
          - required_acl
          - origin_uuid
          - timestamp
          - tenant_uuid
  auth_tenant_updated:
    subscribe:
      summary: ''
      tags:
      - name: auth
      message:
        name: auth-tenant-updated-payload
        payload:
          type: object
          properties:
            name:
              type: string
        headers:
          type: object
          properties:
            name:
              type: string
              const: auth_tenant_updated
              description: Name of the event (used for routing the message)
            required_acl:
