asyncapi: 2.0.0
info:
  title: wazo-calld events
  version: '26.08'
servers:
  production:
    url: amqp://{username}:{password}@/localhost:{port}//
    description: Local RabbitMQ messaging server for inter-service communication
    protocol: amqp
    protocolVersion: 0.9.1
    variables:
      username:
        default: guest
        description: Configurable through each service's config.yml file
      password:
        default: guest
        description: Configurable through each service's config.yml file
      port:
        default: '5672'
        description: Configurable through each service's config.yml file
defaultContentType: application/json
channels:
  agent_status_update:
    subscribe:
      summary: An agent status has changed
      tags:
      - name: calld
      message:
        name: agent-status-update-payload
        payload:
          type: object
          properties:
            agent_id:
              type: integer
            status:
              type: string
        headers:
          type: object
          properties:
            name:
              type: string
              const: agent_status_update
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.events.statuses.agents
              description: Necessary user access required to read this event
            origin_uuid:
              $ref: '#/components/schemas/origin_uuid'
            timestamp:
              $ref: '#/components/schemas/timestamp'
            tenant_uuid:
              $ref: '#/components/schemas/tenant_uuid'
            user_uuid:{uuid}:
              $ref: '#/components/schemas/user_uuid:{uuid}'
          required:
          - name
          - required_acl
          - origin_uuid
          - timestamp
          - tenant_uuid
          - user_uuid:{uuid}
  application_call_answered:
    subscribe:
      summary: ''
      tags:
      - name: calld
      message:
        name: application-call-answered-payload
        payload:
          type: object
          properties:
            application_call:
              type: object
              properties:
                id:
                  type: string
                caller_id_name:
                  type: string
                caller_id_number:
                  type: string
                conversation_id:
                  type: string
                creation_time:
                  type: string
                  format: date-time
                status:
                  type: string
                on_hold:
                  type: boolean
                is_caller:
                  type: boolean
                dialed_extension:
                  type: string
                variables:
                  type: object
                  properties: {}
                node_uuid:
                  type: string
                  format: uuid
                moh_uuid:
                  type: string
                  format: uuid
                muted:
                  type: boolean
                snoops:
                  type: object
                  properties: {}
                user_uuid:
                  type: string
                  format: uuid
                tenant_uuid:
                  type: string
                  format: uuid
            application_uuid:
              type: string
              format: uuid
        headers:
          type: object
          properties:
            name:
              type: string
              const: application_call_answered
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.applications.{application_uuid}.calls.{call[id]}.answered
              description: Necessary user access required to read this event
            origin_uuid:
