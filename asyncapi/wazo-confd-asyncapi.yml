asyncapi: 2.0.0
info:
  title: wazo-confd events
  version: '26.08'
servers:
  production:
    url: amqp://{username}:{password}@/localhost:{port}//
    description: Local RabbitMQ messaging server for inter-service communication
    protocol: amqp
    protocolVersion: 0.9.1
    variables:
      username:
        default: guest
        description: Configurable through each service's config.yml file
      password:
        default: guest
        description: Configurable through each service's config.yml file
      port:
        default: '5672'
        description: Configurable through each service's config.yml file
defaultContentType: application/json
channels:
  access_feature_created:
    subscribe:
      summary: ''
      tags:
      - name: confd
      message:
        name: access-feature-created-payload
        payload:
          type: object
          properties:
            id:
              type: integer
            host:
              type: string
            feature:
              type: string
            enabled:
              type: boolean
        headers:
          type: object
          properties:
            name:
              type: string
              const: access_feature_created
              description: Name of the event (used for routing the message)
            required_acl:
              type: string
              const: events.config.access_feature.created
              description: Necessary user access required to read this event
            origin_uuid:
              $ref: '#/components/schemas/origin_uuid'
            timestamp:
              $ref: '#/components/schemas/timestamp'
          required:
          - name
          - required_acl
          - origin_uuid
          - timestamp
  access_feature_deleted:
    subscribe:
      summary: ''
      tags:
      - name: confd
      message:
        name: access-feature-deleted-payload
