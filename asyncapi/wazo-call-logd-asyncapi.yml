            destination_internal_context:
              type: string
            destination_internal_extension:
              type: string
            destination_line_id:
              type: integer
            destination_name:
              type: string
            destination_user_uuid:
              type: string
              format: uuid
            requested_name:
              type: string
            requested_context:
              type: string
            requested_extension:
              type: string
            requested_internal_context:
