overlay: 1.0.0
info:
  title: API Evangelist enhancements for wazo-plugind
  version: 1.0.0
extends: openapi/wazo-plugind-api-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: wazo
    x-apievangelist-service: wazo-plugind
    x-apievangelist-surface: Plugins
    x-apievangelist-source-repository: https://github.com/wazo-platform/wazo-plugind
    x-apievangelist-assembly: base plugin api.yml deep-merged with plugin api.yml fragments, reproducing the document the
      running service serves at /api/plugind/0.2/api/api.yml
    x-apievangelist-operations: 8
    x-apievangelist-tags: 4
    x-apievangelist-operations-missing-operationid: 6
    x-apievangelist-acl-permissions: 7
    x-apievangelist-authorization-model: acl
    x-apievangelist-idempotency: false
    x-apievangelist-rate-limits-published: false
    x-apievangelist-error-format: application/json (not RFC 9457)
    x-apievangelist-license: GPL-3.0-or-later
- target: $
  update:
    x-apievangelist-base-url-template: https://{wazo_stack}/api/plugind/0.2
    x-apievangelist-base-url-note: 'Self-hosted: no public multi-tenant host exists. Route verified against the service
      repository etc/nginx/locations/https-available/ file.'
    x-apievangelist-artifacts:
      authentication: authentication/wazo-authentication.yml
      acl_permissions: scopes/wazo-acl-permissions.yml
      conventions: conventions/wazo-conventions.yml
      errors: errors/wazo-problem-types.yml
      lifecycle: lifecycle/wazo-lifecycle.yml
      events: asyncapi/wazo-events-webhooks.yml
      data_model: data-model/wazo-data-model.yml
