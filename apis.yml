- name: Wazo Websocket Event Stream (wazo-websocketd)
  description: WebSocket gateway onto the Wazo internal event bus. An authenticated client subscribes to named platform
    events (327 event types across confd, calld, agentd, dird, amid, sysconfd and webhookd) and receives them as JSON frames
    in real time. There is no REST contract for this surface; the event catalogue is captured as a webhook/event artifact
    rather than an AsyncAPI document because Wazo publishes none.
