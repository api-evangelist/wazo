  description: Authentication and authorisation service for the Wazo Platform. Issues and validates X-Auth-Token tokens
    (username/password, LDAP, SAML and external identity providers including Google, Microsoft and mobile push), and manages
    tenants, users, groups, sessions, refresh tokens, policies and fine-grained ACL access rules that every other Wazo service
    enforces.
