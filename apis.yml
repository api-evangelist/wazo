aid: wazo
name: Wazo
description: 'Wazo Communication Inc. builds the Wazo Platform, an open-source (GPL-3.0) programmable unified-communications
  and contact-centre platform assembled from Asterisk, Kamailio, RabbitMQ, PostgreSQL and nginx, which MSPs, carriers, telecom
  integrators and enterprises self-host or resell white-label as UCaaS. The platform is API-first: thirteen HTTP microservices
  — authentication, stack configuration (confd), runtime call control (calld), call detail records, directories, call-centre
  agents, presence and chat, phone auto-provisioning, webhooks, plugin management, the Asterisk Manager facade and initial
  setup — each publish their own Swagger 2.0 contract totalling 932 operations, share a single X-Auth-Token bearer model
  governed by 788 fine-grained ACL permissions, and emit 327 named events onto a RabbitMQ bus that wazo-webhookd relays
  as HTTP webhooks and wazo-websocketd streams over WebSocket. There is no public multi-tenant API host: every base URL
  is the customer''s own stack.'
image: https://wazo-platform.org/images/logo-black.svg
url: https://raw.githubusercontent.com/api-evangelist/wazo/refs/heads/main/apis.yml
x-type: company
x-source: serena-portfolio
