openapi: 3.2.0
info:
  title: wazo-confd Timezones API
  description: Confd exposes an API for managing core resources on a Wazo server such as users, extensions, devices, voicemails, queues, etc.
  version: '1.1'
  license:
    name: GPL v3
    url: http://www.gnu.org/licenses/gpl.txt
  contact:
    name: Wazo Dev Team
    url: https://wazo-platform.org/
    email: dev@wazo.community
  x-logo:
    url: https://wazo-platform.org/images/logo-black.svg
    backgroundColor: '#FAFAFA'
    altText: Wazo Logo
servers:
- url: /1.1
security:
- wazo_auth_token: []
tags:
- name: Timezones
paths:
  /timezones:
    get:
      operationId: list_timezones
      summary: List all available timezones
      description: '**Required ACL:** `confd.timezones.read`'
      tags:
      - Timezones
      responses:
        '200':
          description: List timezones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimezoneItems'
components:
  schemas:
    TimezoneItems:
      title: TimezoneItems
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Timezone'
        total:
          type: integer
    Timezone:
      title: Timezone
      properties:
        zone_name:
          type: string
  securitySchemes:
    wazo_auth_token:
      type: apiKey
      name: X-Auth-Token
      in: header
x-xivo-port: 9486
x-xivo-name: confd
x-apievangelist-source:
  harvested_from: https://github.com/wazo-platform/wazo-confd
  assembly: base plugin api.yml deep-merged with all plugin api.yml fragments, reproducing what the running service serves at /api/confd/1.1/api/api.yml (see wazo_confd/plugins/api/http.py — xivo.chain_map.ChainMap)
  spec_version: Swagger 2.0 (as published by Wazo)
  harvested: '2026-08-17'
