openapi: 3.2.0
info:
  title: wazo-phoned Yealink API
  description: Wazo Phone Daemon
  version: '1.0'
  contact:
    name: Wazo Dev Team
    url: https://wazo-platform.org/
    email: dev@wazo.community
  x-logo:
    url: https://wazo-platform.org/images/logo-black.svg
    backgroundColor: '#FAFAFA'
    altText: Wazo Logo
servers:
- url: /0.1
security:
- wazo_auth_token: []
tags:
- name: yealink
paths:
  /directories/lookup/{profile}/yealink:
    get:
      summary: Search for contacts with Yealink Phones
      description: 'The `lookup` query will return a list of result matching the searched term

        formated for Yealink Phones. The result will be retrieved from a lookup query

        to wazo-dird.

        '
      operationId: lookup_yealink
      deprecated: true
      tags:
      - yealink
      responses:
        '200':
          description: A list of contacts
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/YealinkIPPhoneDirectory'
        '400':
          $ref: '#/components/responses/LimitOffsetInvalid'
        '404':
          $ref: '#/components/responses/ProfileInvalid'
        '503':
          $ref: '#/components/responses/AnotherServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/XivoUserUUID'
      - $ref: '#/components/parameters/Term'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/AcceptLanguage'
  /yealink/directories/lookup/{profile}:
    get:
      summary: Search for contacts with Yealink Phones
      description: 'The `lookup` query will return a list of result matching the searched term

        formated for Yealink Phones. The result will be retrieved from a lookup query

        to wazo-dird.

        '
      operationId: yealink_lookup
      tags:
      - yealink
      responses:
        '200':
          description: A list of contacts
          content:
            text/xml:
              schema:
                $ref: '#/components/schemas/YealinkIPPhoneDirectory'
        '400':
          $ref: '#/components/responses/LimitOffsetInvalid'
        '404':
          $ref: '#/components/responses/ProfileInvalid'
        '503':
          $ref: '#/components/responses/AnotherServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/Profile'
      - $ref: '#/components/parameters/XivoUserUUID'
      - $ref: '#/components/parameters/Term'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/AcceptLanguage'
  /yealink/users/{user_uuid}/services/dnd/enable:
    get:
      summary: Enable the DND service for a particular user.
      description: 'This `dnd` service endpoint will enable the user DND service through

        `wazo-confd`.

        '
      operationId: yealink_user_service_dnd_enable
      tags:
      - yealink
      responses:
        '200':
          description: The status was changed
        '400':
          description: Provided data is incorrect or a required field is missing
          content:
            text/xml:
              schema:
                $ref: '#/components/responses/InvalidDataError'
        '404':
          $ref: '#/components/responses/NoSuchUser'
      parameters:
      - $ref: '#/components/parameters/UserUUID'
  /yealink/users/{user_uuid}/services/dnd/disable:
    get:
      summary: Disable the DND service for a particular user.
      description: 'This `dnd` service endpoint will disable the user DND service through

        `wazo-confd`.

        '
      operationId: yealink_user_service_dnd_disable
      tags:
      - yealink
      responses:
        '200':
          description: The status was changed
        '400':
          description: Provided data is incorrect or a required field is missing
          content:
            text/xml:
              schema:
                $ref: '#/components/responses/InvalidDataError'
        '404':
          $ref: '#/components/responses/NoSuchUser'
      parameters:
      - $ref: '#/components/parameters/UserUUID'
components:
  parameters:
    UserUUID:
      name: user_uuid
      in: path
      description: The user UUID of the user doing that query
      required: true
      schema:
        type: string
    Profile:
      name: profile
      in: path
      description: The profile defines the list of directories to query and how the results are displayed. The profile is the context name of the user who started the contact lookup, e.g. `default`.
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: The limit defines the number of individual objects that are returned
      required: false
      schema:
        type: integer
    Term:
      name: term
      in: query
      description: A search term to look for
      required: true
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: The offset defines the offsets the start by the number specified
      required: false
      schema:
        type: integer
        default: 0
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: The language to translate the query results in
      schema:
        type: string
    XivoUserUUID:
      name: xivo_user_uuid
      in: query
      description: The user UUID of the user doing that query
      required: true
      schema:
        type: string
  responses:
    InvalidDataError:
      description: Data provided is invalid or a field is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProfileInvalid:
      description: The profile does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoSuchUser:
      description: The user does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AnotherServiceUnavailable:
      description: Another service is unavailable (e.g. wazo-auth, wazo-dird, ...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LimitOffsetInvalid:
      description: The limit or offset should be positive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    YealinkIPPhoneDirectory:
      properties:
        DirectoryEntry:
          type: array
          items:
            $ref: '#/components/schemas/YealinkDirectoryEntry'
    Error:
      type: object
      title: Error
      description: Error message for the client
      properties:
        message:
          description: Human readable explanation of the error
          type: string
        error_id:
          description: Identifier of the type of error. It is more precise than the HTTP status code.
          type: string
        details:
          description: Additional information about the error. The keys are specific to each error.
          type: object
        timestamp:
          description: Time when the error occured
          type: number
          format: timestamp
    YealinkDirectoryEntry:
      properties:
        Name:
          type: string
        Telephone:
          type: string
  securitySchemes:
    wazo_auth_token:
      type: apiKey
      name: X-Auth-Token
      in: header
x-xivo-port:
- 9499
x-xivo-name: phoned
