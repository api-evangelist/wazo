openapi: 3.2.0
info:
  title: wazo-confd Ha API
  description: Confd exposes an API for managing core resources on a Wazo server such as users, extensions, devices, voicemails, queues, etc.
  version: '1.1'
  license:
    name: GPL v3
    url: http://www.gnu.org/licenses/gpl.txt
  contact:
    name: Wazo Dev Team
    url: https://wazo-platform.org/
    email: dev@wazo.community
  x-logo:
    url: https://wazo-platform.org/images/logo-black.svg
    backgroundColor: '#FAFAFA'
    altText: Wazo Logo
servers:
- url: /1.1
security:
- wazo_auth_token: []
tags:
- name: HA
paths:
  /ha:
    get:
      operationId: get_ha
      summary: Get High Availability configuration
      description: '**Required ACL:** `confd.ha.read`'
      tags:
      - HA
      responses:
        '200':
          description: High Availability configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HA'
    put:
      operationId: update_ha
      summary: Update High Availability configuration
      description: '**Required ACL:** `confd.ha.update`'
      tags:
      - HA
      responses:
        '204':
          $ref: '#/components/responses/ResourceUpdated'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HA'
        required: true
components:
  responses:
    ResourceUpdated:
      description: Resource was updated successfully
  schemas:
    HA:
      title: HA
      type: object
      properties:
        node_type:
          type: string
          description: The role of this server in a HA cluster.
          enum:
          - disabled
          - master
          - slave
        remote_address:
          type: string
          description: The remote IP address of the other machine in the HA cluster. Must be an IP address, a hostname is invalid.
      required:
      - node_type
  securitySchemes:
    wazo_auth_token:
      type: apiKey
      name: X-Auth-Token
      in: header
x-xivo-port: 9486
x-xivo-name: confd
x-apievangelist-source:
  harvested_from: https://github.com/wazo-platform/wazo-confd
  assembly: base plugin api.yml deep-merged with all plugin api.yml fragments, reproducing what the running service serves at /api/confd/1.1/api/api.yml (see wazo_confd/plugins/api/http.py — xivo.chain_map.ChainMap)
  spec_version: Swagger 2.0 (as published by Wazo)
  harvested: '2026-08-17'
