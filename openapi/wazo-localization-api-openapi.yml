openapi: 3.2.0
info:
  title: wazo-confd Localization API
  description: Confd exposes an API for managing core resources on a Wazo server such as users, extensions, devices, voicemails, queues, etc.
  version: '1.1'
  license:
    name: GPL v3
    url: http://www.gnu.org/licenses/gpl.txt
  contact:
    name: Wazo Dev Team
    url: https://wazo-platform.org/
    email: dev@wazo.community
  x-logo:
    url: https://wazo-platform.org/images/logo-black.svg
    backgroundColor: '#FAFAFA'
    altText: Wazo Logo
servers:
- url: /1.1
security:
- wazo_auth_token: []
tags:
- name: Localization
paths:
  /localization:
    get:
      operationId: get_localization
      summary: Get localization configuration
      description: '**Required ACL:** `confd.localization.read`'
      tags:
      - Localization
      parameters:
      - $ref: '#/components/parameters/tenantuuid'
      responses:
        '200':
          description: Localization configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Localization'
    put:
      operationId: update_localization
      summary: Update localization configuration
      description: '**Required ACL:** `confd.localization.update`'
      tags:
      - Localization
      parameters:
      - $ref: '#/components/parameters/tenantuuid'
      responses:
        '204':
          $ref: '#/components/responses/ResourceUpdated'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Localization'
        required: true
components:
  parameters:
    tenantuuid:
      name: Wazo-Tenant
      in: header
      description: The tenant's UUID, defining the ownership of a given resource.
      required: false
      schema:
        type: string
  schemas:
    Localization:
      title: Localization
      type: object
      properties:
        country:
          type: string
          description: The default country for users, in ISO-3166 alpha-2 format, e.g. "CA" for Canada.
        tenant_uuid:
          type: string
          description: UUID of the tenant
  responses:
    ResourceUpdated:
      description: Resource was updated successfully
  securitySchemes:
    wazo_auth_token:
      type: apiKey
      name: X-Auth-Token
      in: header
x-xivo-port: 9486
x-xivo-name: confd
x-apievangelist-source:
  harvested_from: https://github.com/wazo-platform/wazo-confd
  assembly: base plugin api.yml deep-merged with all plugin api.yml fragments, reproducing what the running service serves at /api/confd/1.1/api/api.yml (see wazo_confd/plugins/api/http.py — xivo.chain_map.ChainMap)
  spec_version: Swagger 2.0 (as published by Wazo)
  harvested: '2026-08-17'
