      required: false
      schema:
        type: string
    customid:
      required: true
      name: custom_id
      in: path
      schema:
        type: integer
    offset:
      required: false
      name: offset
      in: query
      description: Number of items to skip over in the list. Useful for pagination.
      schema:
        type: integer
    order:
      required: false
      name: order
      in: query
      description: Name of the field to use for sorting the list of items returned.
      schema:
        type: string
    template_uuid:
      required: true
      name: template_uuid
      in: path
      schema:
        type: string
