        required: true
    delete:
      summary: Delete a custom greeting
      description: '**Required ACL:** `calld.voicemails.{voicemail_id}.greetings.{greeting}.delete`'
      parameters:
      - $ref: '#/components/parameters/VoicemailID'
      - $ref: '#/components/parameters/VoicemailGreeting'
