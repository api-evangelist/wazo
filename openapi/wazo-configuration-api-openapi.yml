components:
  schemas:
    Error:
      type: array
      items:
        type: string
    LiveReload:
      title: LiveReload
      properties:
        enabled:
          type: boolean
    LegacyError:
      title: LegacyError
      description: Error message for the client
      properties:
        timestamp:
          description: Time at which the error occured
          type: array
          items:
            type: number
            format: timestamp
        reason:
          description: Human readable explanation of the error
          type: array
          items:
            type: string
        status_code:
          description: HTTP status code
          type: integer
    MicrosoftSource:
      title: MicrosoftSource
      description: 'In addition to the keys defined by the [Microsoft API](https://docs.microsoft.com/en-us/graph/api/resources/contact?view=graph-rest-1.0#),

        `format_columns` also accepts the following columns:

        * a `numbers` field that aggregates the values from the `businessPhones`, `homePhones` and `mobilePhone` fields. Example: `"format_columns": {"phone": "{numbers[0]}"}`

        * a `numbers_except_label` field that aggregates the same values than `numbers`, except for one field. Example: `"format_columns": {"phone": "{numbers_except_label[mobilePhone][0]}"}` will result in one of the phone numbers except the mobile phone.

        '
      allOf:
      - $ref: '#/components/schemas/Source'
      - properties:
          auth:
            $ref: '#/components/schemas/WazoAuthConfig'
          confd:
            $ref: '#/components/schemas/ConfdConfig'
          endpoint:
            description: Endpoint where to get the information from
            example: https://graph.microsoft.com/v1.0/me/contacts
            default: https://graph.microsoft.com/v1.0/me/contacts
            type: string
      - required:
        - name
        - auth
        - confd
    DisplayIdentifier:
      title: DisplayUUID
      allOf:
      - properties:
          uuid:
            type: string
            description: The display's UUID
      - required:
        - uuid
    APIError:
      type: object
      properties:
        timestamp:
          type: number
        message:
          type: string
        resource:
          type: string
        details:
          type: object
    MicrosoftSourceItems:
      title: MicrosoftSourceItems
      allOf:
      - $ref: '#/components/schemas/SourceItems'
      - properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/MicrosoftSource'
            readOnly: true
      - required:
        - items
        - total
        - filtered
    SourceListItems:
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SourceListItem'
          readOnly: true
        total:
          type: integer
          description: The number of sources
          readOnly: true
        filtered:
          type: integer
          description: The number of sources matching the search filters
          readOnly: true
      required:
      - items
      - total
      - filtered
    BackendItems:
      title: BackendItems
      allOf:
      - properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Backend'
            readOnly: true
          total:
            type: integer
            description: The number of backends
            readOnly: true
          filtered:
            type: integer
            description: The number of backends matching the search filters
            readOnly: true
      - required:
        - items
        - total
        - filtered
    Profile:
      title: Profile
      allOf:
      - properties:
          uuid:
            type: string
            readOnly: true
          name:
            type: string
            description: The name of the profile
          display:
            $ref: '#/components/schemas/DisplayIdentifier'
          services:
            type: object
            properties:
              name:
                $ref: '#/components/schemas/ServiceConfiguration'
      - required:
        - name
    SourceListItem:
      properties:
        uuid:
          type: string
          description: The UUID of the source
          readOnly: true
        backend:
          type: string
          description: The backend of this source
          readOnly: true
        name:
          type: string
          description: The name of the source
          readOnly: true
      required:
      - uuid
      - backend
      - name
    PhonebookSource:
