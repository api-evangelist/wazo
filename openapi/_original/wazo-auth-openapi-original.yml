              description: 'The `domain_name` must match a tenant''s domain_name entry to find the appropriate ldap configuration.

                '
            expiration:
              type: integer
              default: 7200
              maximum: 315360000
              description: Expiration time in seconds.
            access_type:
              type: string
              description: 'The `access_type` indicates whether your application can refresh the tokens when the user is not

                present at the browser. Valid parameter values are *online*, which is the default value, and *offline*


                Only one refresh token will be created for a given user with a given `client_id`. The old refresh

                for `client_id` will be revoken when creating a new one.


                The *client_id* field is required when using the `access_type` *offline*

                '
              default: online
              enum:
              - online
              - offline
            client_id:
              type: string
              description: 'The `client_id` is used in conjunction with the `access_type` *offline* to known for which application

                a refresh token has been emitted.


                *Required when using `access_type: offline`*

                '
            refresh_token:
              type: string
              description: 'The `refresh_token` can be used to get a new access token without using the username/password.

                This is useful for client application that should not store the username and password once the

                user has logged in a first time.

                '
            saml_session_id:
              type: string
              description: 'The `saml_session_id` can be used to get a new access token or refresh token instead of using

                the username/password. It can be created using the `/saml/sso` and `/saml/acs` resources. A token

                created this way has the same properties as another token created using this API.

                '
      responses:
        '200':
          description: The created token's data
          schema:
            $ref: '#/definitions/Token'
          headers:
