    get:
      operationId: list_google_source
      summary: Get google configuration
      description: '**Required ACL:** `dird.backends.google.sources.read`'
      tags:
      - configuration
      - google
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - $ref: '#/parameters/recurse'
      - $ref: '#/parameters/order'
      - $ref: '#/parameters/direction'
      - $ref: '#/parameters/Limit'
      - $ref: '#/parameters/Offset'
      responses:
        '200':
          description: Configured google source
          schema:
            $ref: '#/definitions/GoogleSourceItems'
    post:
      operationId: create_google_source
      summary: Configure a source for the google backend
      description: '**Required ACL:** `dird.backends.google.sources.create`


        This resource configures a Google source for wazo-dird. Columns that are available from this source

        are:


        * name: the contact name

        * numbers: a list of phone numbers

        * numbers_by_label: a map of type to numbers {''mobile'': <number>, ''home'': <number>, ...}. Types are defined by
        Google, currently known types include: ''home'', ''work'', ''mobile'', ''other'', ''main'', ''home_fax'', ''work_fax'',
        ''google_voice'', ''pager''.

        * numbers_except_label: a map from type to every other number {''mobile'': [<number>, <number], ''home'': [<number>,
        <number>], ...}. See available types above. For example, the ''mobile'' key will contain the ''work'' and ''home''
        numbers, but will exclude the ''mobile'' number.

        * emails: a list of email addresses

        '
      tags:
      - configuration
      - google
      parameters:
      - $ref: '#/parameters/tenantuuid'
      - in: body
        name: body
        description: The display configuration body
        required: true
        schema:
          $ref: '#/definitions/GoogleSource'
      responses:
        '201':
          description: The created display
          schema:
            $ref: '#/definitions/GoogleSource'
          examples:
            application/json:
              auth:
                host: localhost
                port: 80
                prefix: /api/auth
                https: false
                version: 0.1
              format_columns:
                phone: '{numbers[0]}'
                phone_mobile: '{numbers_by_label[mobile]}'
                reverse: '{name}'
                email: '{emails[0]}'
              name: google
              first_matched_columns:
              - numbers
              searched_columns:
              - numbers
              - emails
              - name
        '400':
          $ref: '#/responses/CreateError'
        '409':
          description: Source already exists
          schema:
            $ref: '#/definitions/LegacyError'
