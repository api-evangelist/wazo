    properties:
      options:
        description: "These options must be unique and unordered. Otherwise, use `ordered_options`. Option must have the following\
          \ form:\n\n```\n{\n  \"options\": {\n    \"name1\": \"value1\",\n    ...\n  }\n}\n```\n\n"
        type: object
    example:
      options:
        enabled: 'yes'
  IAXCallNumberLimitss:
    title: IAXCallNumberLimitss
    properties:
      items:
