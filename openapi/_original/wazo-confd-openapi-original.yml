      enabled:
        type: boolean
        default: true
        description: Enable/Disable the user
      tenant_uuid:
        type: string
        description: The UUID of the tenant
        readOnly: true
      lines:
        type: array
        items:
          $ref: '#/definitions/UserPostRelationLine'
      groups:
        type: array
