        description: Email address. Notifications and audio attachments will be sent to this address
      pager:
        type: string
        description: Email address. Summarized notifications will be sent to this address
      language:
        type: string
        enum:
        - de_DE
        - en_US
        - es_ES
        - fr_FR
        - fr_CA
        - it_IT
        - nl_NL
        description: Language used for the voicemail menu prompt
      timezone:
        type: string
        default: The system default timezone
        description: Timezone used for announcing at what time a message was recorded
      max_messages:
        type: integer
        description: Maximum number of messages to store
      attach_audio:
        type: boolean
        description: Attach an audio file of the recorded message when sending an email
      delete_messages:
        type: boolean
        description: "Delete messages after reception. \nThis can only be set along with 'email' and 'attach_audio' configured.\n"
        default: false
      ask_password:
        type: boolean
        description: Ask for password when accessing the voicemail menu
        default: true
      enabled:
        type: boolean
        description: Voicemail can be used when it is enabled
        default: true
      tenant_uuid:
        type: string
        description: The UUID of the tenant
        readOnly: true
      accesstype:
        type: string
        enum:
        - personal
        - global
        description: Access type of the voicemail. 'personal' means the voicemail is associated with specific users, 'global'
          means it is shared across the context. Only one global voicemail can exist per context.
        default: personal
      options:
        description: "Advanced configuration options. Options are appended at the end of a \nvoicemail line in the file 'voicemail.conf'\
          \ used by asterisk.\nPlease consult the asterisk documentation for further details on available\nparameters. Options\
          \ must have the following the form:\n\n```\n{\n  \"options\": [\n    [\"name1\", \"value1\"],\n    [\"name2\", \"\
          value2\"]\n  ]\n}\n```\n\nThe resulting configuration in voicemail.conf will have the following form:\n\n```\n1000\
          \ => ,Firstname Lastname,,,name1=value1|name2=value2\n```\n"
        type: array
        items:
          $ref: '#/definitions/KeyValueOption'
