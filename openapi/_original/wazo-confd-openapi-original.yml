        type: string
        description: The public URI to contact this stack HTTP API
    required:
    - uri
  Ivr:
    title: IVR
    allOf:
    - properties:
        id:
          type: integer
          readOnly: true
          description: The id of the IVR
        tenant_uuid:
          type: string
          description: The UUID of the tenant
          readOnly: true
        name:
          type: string
          description: The name of the IVR
        description:
          type: string
          description: Additional information about the IVR
        greeting_sound:
          type: string
          description: The sound played to greet the caller
        menu_sound:
          type: string
          description: The sound played to prompt the caller for input
        invalid_sound:
          type: string
          description: The sound played when the caller choose an invalid option. Not used if an invalid destination is set
        abort_sound:
          type: string
          description: The sound played when the caller reach the maximum number of tries. Not used if an abort destination
            is set
        timeout:
          type: integer
          default: 5
          description: Number of seconds to wait after the menu sound is played before either replaying the menu, redirecting
            the call to the timeout destination (if set) or aborting the call (if the maximum number of tries has been reached)
        max_tries:
          type: integer
          default: 3
          description: The maximum number of tries before aborting the call. Both a timeout and an invalid choice counts toward
            the number of tries
        invalid_destination:
          description: The destination to redirect the caller to when he choose an invalid option. If not set, the menu will
            be replayed
          $ref: '#/definitions/DestinationType'
        timeout_destination:
          description: The destination to redirect the caller to on timeout. If not set, the menu will be replayed
          $ref: '#/definitions/DestinationType'
        abort_destination:
          description: The destination to redirect the caller to when the maximum number of tries is reached. If not set,
            the call will be hanged up after playing the abort sound (if set)
          $ref: '#/definitions/DestinationType'
        choices:
          type: array
          description: The menu's choices
          items:
            $ref: '#/definitions/IvrChoice'
    - $ref: '#/definitions/IvrRelationIncalls'
    - required:
      - name
      - menu_sound
    example:
      name: ivr1
      description: My IVR
      greeting_sound: /var/lib/wazo/sounds/playback/ivr1-greeting
      menu_sound: /var/lib/wazo/sounds/playback/ivr1-menu
      abort_destination:
        type: group
        group_id: 1
      choices:
      - exten: '1'
        destination:
          type: user
          user_id: 2
      - exten: '0'
        destination:
          type: group
          group_id: 1
  IvrRelationIncalls:
    properties:
      incalls:
        type: array
        readOnly: true
        items:
          $ref: '#/definitions/IvrRelationIncall'
  IvrRelationIncall:
