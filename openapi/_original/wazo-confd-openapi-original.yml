      limit:
        type: string
        description: Maximum call for the ip_address destination
    required:
    - ip_address
    - netmask
    - limit
  IAXGeneral:
    title: IAXGeneral
    description: 'IAX general configuration. This configuration will be in the file ''iax.conf'' used by asterisk.

      Please consult the asterisk documentation for further details on available parameters.'
    properties:
      options:
        description: "General IAX options. These options must be unique and unordered. Otherwise, use `ordered_options`. Option\
          \ must have the following form:\n\n```\n{\n  \"options\": {\n    \"name1\": \"value1\",\n    ...\n  }\n}\n```\n\n"
        type: object
      ordered_options:
        description: "Any options may be repeated as many times and ordered as needed. Ordered options must have the following\
          \ form:\n\n```\n{\n  \"ordered_options\": [\n    [\"name1\", \"value1\"],\n    [\"name2\", \"value2\"]\n  ]\n}\n\
          ```\n\nThe resulting configuration in iax.conf will have the following form:\n\n```\n[general]\nname1=value1\nname2=value2\n\
          ```\n"
        type: array
        items:
          $ref: '#/definitions/KeyValueOption'
  Incall:
    title: Incall
    allOf:
    - $ref: '#/definitions/IncallRelationBase'
    - properties:
        tenant_uuid:
          type: string
          description: The UUID of the tenant
          readOnly: true
        preprocess_subroutine:
          type: string
          description: Name of the subroutine to execute in asterisk before receiving a call
        description:
          type: string
          description: Additional information about the incoming call
        caller_id_mode:
          type: string
          enum:
          - prepend
          - overwrite
          - append
          description: How the caller_id_name will be treated
        caller_id_name:
          type: string
          description: Name to display when calling
        destination:
          description: The destination where the incoming call will be redirected
