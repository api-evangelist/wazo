    - $ref: '#/definitions/IncallRelationExtensions'
  IvrChoice:
    title: IvrChoice
    properties:
      destination:
        description: The destination to redirect the caller to when this choice is selected
        $ref: '#/definitions/DestinationType'
      exten:
        type: string
        description: 'The extension the caller has to dial to select this choice. Can be an asterisk extension pattern, digits
          (0-9), * or #'
        pattern: ^_[*#0-9_XxZzNn\[\].!-]{1,39}$|[*#0-9]{1,40}$
