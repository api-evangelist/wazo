      preprocess_subroutine:
        type: string
        description: Name of the subroutine to execute in asterisk before receiving a call
      userfield:
        type: string
        description: A custom field which purpose is left to the client. If the user has no userfield, then this field is
          an empty string.
      call_permission_password:
        type: string
