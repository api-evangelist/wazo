        required: true
  /tenants/{tenant}/phonebooks/{phonebook_id}/contacts/import:
    post:
      summary: Import multiple contacts at once
      description: '**Required ACL:** `dird.tenants.{tenant}.phonebooks.{phonebook_id}.contacts.create`'
